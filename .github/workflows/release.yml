name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate semantic version tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0." >&2
            exit 1
          fi

          version="${tag#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "go2rust-cli") | .version')"

          if [[ "${version}" != "${manifest_version}" ]]; then
            echo "Tag version ${version} does not match Cargo.toml version ${manifest_version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-linux:
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          archive="go2rust-cli-v${version}-linux-x86_64.tar.gz"

          mkdir -p dist
          tar -czf "dist/${archive}" -C target/release go2rust-cli
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  publish-container:
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - build-linux
      - publish-container
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          cat > release-notes.md <<EOF
          ## Install

          Download the Linux archive from this release, or run the container image:

          \`\`\`sh
          docker run --rm -v "\$PWD:/workspace" ${IMAGE_NAME}:${VERSION} convert -i examples/hello.go
          \`\`\`

          ## Version

          This release uses Major.Minor.Patch versioning: ${VERSION}.
          EOF

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "go2rust-cli ${VERSION}" \
            --notes-file release-notes.md

